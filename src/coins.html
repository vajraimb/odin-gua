<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>三钱</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: var(--color-text-primary, #2c241c);
    --muted: var(--color-text-secondary, #8a7b6a);
    --paper: var(--color-background-primary, transparent);
  }
  [data-theme="dark"] {
    --ink: var(--color-text-primary, #f3eadc);
    --muted: var(--color-text-secondary, #cbbba6);
  }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 13px/1.2 "Iowan Old Style", Palatino, "Songti SC", "Noto Serif SC", "WenQuanYi Micro Hei", serif;
  }
  .wrap { box-sizing: border-box; width: max-content; max-width: 100%; margin: 0 auto; padding: 1px 2px 4px; }
  .cap {
    font-size: 12px; letter-spacing: 0.14em; color: var(--muted);
    min-height: 1.15em; text-align: center;
  }
  .stage {
    height: 36px; margin-top: 1px;
    display: flex; justify-content: center; align-items: flex-end; gap: 8px;
  }
  .stage[hidden] { display: none; }
  canvas { width: 26px; height: 36px; display: block; }
  .rows { display: flex; flex-direction: column-reverse; margin-top: 1px; }
  .row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    max-height: 0; opacity: 0; overflow: hidden;
    animation: sprout 340ms cubic-bezier(.16, .84, .28, 1) forwards;
  }
  .row.still { animation: none; max-height: 15px; opacity: 1; }
  @keyframes sprout {
    from { max-height: 0; opacity: 0; transform: translateY(-3px); }
    to { max-height: 15px; opacity: 1; transform: translateY(0); }
  }
  .ink { width: 7.6em; height: 1.5px; background: var(--ink); position: relative; flex: none; }
  .ink.yin { background: transparent; display: flex; justify-content: space-between; }
  .ink.yin i { display: block; width: 43%; height: 1.5px; background: var(--ink); }
  .ink.old.yang::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 4px; height: 4px; box-sizing: border-box;
    border: 1px solid var(--ink); border-radius: 50%;
    background: var(--paper, #f7f1e8);
    transform: translate(-50%, -50%);
  }
  .ink.old.yin::after {
    content: "×"; position: absolute; left: 50%; top: 50%;
    font-size: 9px; line-height: 1; color: var(--ink);
    transform: translate(-50%, -58%);
  }
  .name { flex: none; white-space: nowrap; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
  .name.moving { color: var(--ink); }
  button {
    display: block; margin: 3px auto 0; padding: 0; border: 0; background: none;
    color: var(--muted); font: inherit; font-size: 12px; letter-spacing: 0.12em;
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  button[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .row { animation: none; max-height: 15px; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="cap" id="cap">候这一掷</div>
    <div class="stage" id="stage" hidden></div>
    <div class="rows" id="rows"></div>
    <button id="again" type="button" hidden>再看一次</button>
  </div>
  <script>
(function () {
  "use strict";
  var POS = ["初", "二", "三", "四", "五", "上"];
  var cap = document.getElementById("cap");
  var stage = document.getElementById("stage");
  var rows = document.getElementById("rows");
  var again = document.getElementById("again");
  var slots = [];
  var faces = {};
  var token = 0;
  var last = null;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = "'Songti SC', 'Noto Serif SC', 'WenQuanYi Micro Hei', 'Droid Sans Fallback', serif";

  function disc(kind) {
    var S = 192;
    var c = document.createElement("canvas");
    c.width = c.height = S;
    var g = c.getContext("2d");
    var cx = S / 2, cy = S / 2, R = S / 2 - 1.5;
    g.beginPath();
    g.arc(cx, cy, R, 0, Math.PI * 2);
    g.clip();
    var metal = g.createRadialGradient(cx - R * 0.34, cy - R * 0.38, R * 0.04, cx + R * 0.1, cy + R * 0.12, R);
    metal.addColorStop(0, "#fff6dc");
    metal.addColorStop(0.22, "#f0d7a0");
    metal.addColorStop(0.58, kind === 3 ? "#c8923c" : "#b78332");
    metal.addColorStop(0.84, "#7d5620");
    metal.addColorStop(1, "#3f2a10");
    g.fillStyle = metal;
    g.fillRect(0, 0, S, S);
    g.save();
    g.globalAlpha = 0.16;
    var i;
    for (i = 10; i < R - 8; i += 2.5) {
      g.beginPath();
      g.arc(cx, cy, i, 0, Math.PI * 2);
      g.strokeStyle = (i % 5 < 2.5) ? "#fff8e8" : "#3a240c";
      g.lineWidth = 0.7;
      g.stroke();
    }
    g.restore();
    g.lineWidth = 8;
    g.strokeStyle = "#f4e4c2";
    g.beginPath(); g.arc(cx, cy, R - 6, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 1.4;
    g.strokeStyle = "#5a3c14";
    g.beginPath(); g.arc(cx, cy, R - 13, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(cx, cy, R - 17, 0, Math.PI * 2); g.stroke();
    var hole = 30;
    g.fillStyle = "rgba(18, 10, 6, 0.94)";
    g.fillRect(cx - hole / 2, cy - hole / 2, hole, hole);
    g.strokeStyle = "#edd9ae";
    g.lineWidth = 1.2;
    g.strokeRect(cx - hole / 2 + 1.2, cy - hole / 2 + 1.2, hole - 2.4, hole - 2.4);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = "600 48px " + FONT;
    g.fillStyle = "rgba(255, 246, 220, 0.45)";
    g.fillText(kind === 3 ? "背" : "字", cx + 0.6, cy - 48);
    g.fillStyle = "#3a260e";
    g.fillText(kind === 3 ? "背" : "字", cx, cy - 49);
    g.font = "500 20px " + FONT;
    g.fillStyle = "#4e3516";
    g.fillText(kind === 3 ? "3" : "2", cx, cy + 50);
    return c;
  }

  function prepare(canvas) {
    var dpr = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
    var cssW = 26, cssH = 36;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas._dpr = dpr;
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
  }

  function paint(canvas, angle, liftPx) {
    var dpr = canvas._dpr;
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    var a = angle % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    var front = a < Math.PI / 2 || a > Math.PI * 1.5;
    var scale = Math.abs(Math.cos(a));
    var r = 11 * dpr;
    var cx = w / 2;
    var base = h - 4 * dpr - r;
    var cy = base - liftPx * dpr;
    var shadowA = 0.22 * (1 - Math.min(liftPx, 8) / 10);
    ctx.fillStyle = "rgba(40, 24, 8, " + shadowA.toFixed(3) + ")";
    ctx.beginPath();
    ctx.ellipse(cx, h - 2.2 * dpr, r * 0.72 * (0.55 + 0.45 * (1 - liftPx / 12)), 1.15 * dpr, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(cx + Math.sin(a) * 1.1 * dpr, cy);
    ctx.scale(Math.max(scale, 0.045), 1);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    var edge = ctx.createLinearGradient(-r, 0, r, 0);
    edge.addColorStop(0, "#4a3010");
    edge.addColorStop(0.42, "#f6e7c4");
    edge.addColorStop(0.55, "#a87430");
    edge.addColorStop(1, "#2e1c0c");
    ctx.fillStyle = edge;
    ctx.fill();
    ctx.restore();
    if (scale > 0.08) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, 1);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(front ? faces[2] : faces[3], -r, -r, r * 2, r * 2);
      ctx.restore();
    }
  }

  function buildCoins() {
    faces[2] = disc(2);
    faces[3] = disc(3);
    stage.textContent = "";
    slots = [];
    for (var i = 0; i < 3; i++) {
      var canvas = document.createElement("canvas");
      prepare(canvas);
      stage.appendChild(canvas);
      slots.push(canvas);
      paint(canvas, 0, 0);
    }
  }

  function lineName(v, i) {
    var yang = v === 7 || v === 9;
    if (i === 0) return yang ? "初九" : "初六";
    if (i === 5) return yang ? "上九" : "上六";
    return (yang ? "九" : "六") + POS[i];
  }
  function kind(v) {
    return {6: "老阴", 7: "少阳", 8: "少阴", 9: "老阳"}[v] || "";
  }
  function addRow(coinFaces, v, i, still) {
    var row = document.createElement("div");
    row.className = "row" + (still ? " still" : "");
    row.dataset.value = String(v);
    if (coinFaces) {
      for (var k = 0; k < 3; k++) row.dataset["c" + k] = String(coinFaces[k]);
    }
    var yang = v === 7 || v === 9;
    var bar = document.createElement("div");
    bar.className = "ink " + (yang ? "yang" : "yin") + ((v === 6 || v === 9) ? " old" : "");
    if (!yang) {
      bar.appendChild(document.createElement("i"));
      bar.appendChild(document.createElement("i"));
    }
    var name = document.createElement("div");
    name.className = "name" + ((v === 6 || v === 9) ? " moving" : "");
    name.textContent = lineName(v, i) + " " + kind(v);
    row.appendChild(bar);
    row.appendChild(name);
    rows.appendChild(row);
  }
  function sum(fs) { return fs[0] + fs[1] + fs[2]; }
  function valuesOf(sc) {
    var s = sc && sc.values != null ? String(sc.values) : "";
    var out = [];
    for (var i = 0; i < s.length && i < 6; i++) out.push(Number(s.charAt(i)));
    return out;
  }
  function validCoins(coins) {
    if (!coins || coins.length !== 6) return false;
    for (var i = 0; i < 6; i++) {
      if (!coins[i] || coins[i].length !== 3) return false;
      for (var k = 0; k < 3; k++) if (coins[i][k] !== 2 && coins[i][k] !== 3) return false;
    }
    return true;
  }
  function showFace(canvas, faceValue) {
    paint(canvas, faceValue === 3 ? Math.PI : 0, 0);
  }
  function toss(canvas, faceValue, delay, turns, my) {
    var end = turns * Math.PI * 2 + (faceValue === 3 ? Math.PI : 0);
    if (reduce) { showFace(canvas, faceValue); return Promise.resolve(); }
    return new Promise(function (resolve) {
      var t0 = null;
      var dur = 620;
      function frame(now) {
        if (my !== token) { resolve(); return; }
        if (t0 == null) t0 = now;
        var t = (now - t0 - delay) / dur;
        if (t < 0) { requestAnimationFrame(frame); return; }
        if (t > 1) t = 1;
        var s = t * t * (3 - 2 * t);
        var lift = Math.sin(Math.PI * s) * 9;
        paint(canvas, end * s, lift);
        if (t >= 1) { showFace(canvas, faceValue); resolve(); return; }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }
  function play(sc, replay) {
    var my = ++token;
    var coins = sc.coins;
    var values = valuesOf(sc);
    last = sc;
    again.hidden = true;
    stage.hidden = false;
    rows.textContent = "";
    cap.textContent = replay ? "再看" : "三钱";
    var i = 0;
    function next() {
      if (my !== token) return;
      if (i >= 6) {
        cap.textContent = "六爻已定";
        again.hidden = false;
        reportSize();
        return;
      }
      cap.textContent = POS[i] + "爻";
      var jobs = [];
      for (var k = 0; k < 3; k++) jobs.push(toss(slots[k], coins[i][k], k * 55, 2 + ((i + k) % 3), my));
      Promise.all(jobs).then(function () {
        if (my !== token) return;
        addRow(coins[i], values[i] || sum(coins[i]), i, false);
        i += 1;
        reportSize();
        setTimeout(next, reduce ? 0 : 90);
      });
    }
    next();
  }
  function showLines(values, still) {
    rows.textContent = "";
    for (var i = 0; i < values.length; i++) addRow(null, values[i], i, still);
  }
  function show(result) {
    if (!result || result.isError) {
      token += 1;
      var msg = textOf(result);
      cap.textContent = msg ? msg.split("\n")[0] : "没有卦象";
      stage.hidden = true;
      again.hidden = true;
      rows.textContent = "";
      reportSize();
      return;
    }
    var sc = result.structuredContent || {};
    if (!validCoins(sc.coins)) {
      token += 1;
      last = null;
      stage.hidden = true;
      again.hidden = true;
      cap.textContent = sc.method === "yarrow" ? "大衍" : (sc.duplicate_of ? "初筮" : "六爻");
      showLines(valuesOf(sc), true);
      reportSize();
      return;
    }
    if (sc.animate === false || reduce) {
      token += 1;
      last = sc;
      stage.hidden = false;
      rows.textContent = "";
      var coins = sc.coins;
      var values = valuesOf(sc);
      for (var i = 0; i < 6; i++) addRow(coins[i], values[i] || sum(coins[i]), i, true);
      for (var k = 0; k < 3; k++) showFace(slots[k], coins[5][k]);
      cap.textContent = sc.duplicate_of ? "初筮" : "六爻已定";
      again.hidden = false;
      reportSize();
      return;
    }
    play(sc, false);
  }
  again.addEventListener("click", function () {
    if (last && validCoins(last.coins)) play(last, true);
  });
  function textOf(result) {
    var c = result && result.content;
    if (!c) return "";
    for (var i = 0; i < c.length; i++) if (c[i] && c[i].type === "text" && c[i].text) return c[i].text;
    return "";
  }

  var seq = 0;
  var pending = {};
  var ready = false;
  var queued = null;
  function send(msg) { window.parent.postMessage(msg, "*"); }
  function notify(method, params) { send({jsonrpc: "2.0", method: method, params: params || {}}); }
  function reportSize() {
    if (window.parent === window) return;
    var box = document.getElementById("wrap").getBoundingClientRect();
    notify("ui/notifications/size-changed", {
      width: Math.ceil(box.width),
      height: Math.ceil(box.height)
    });
  }
  function applyTheme(ctx) {
    if (!ctx) return;
    var vars = ctx.styles && ctx.styles.variables;
    if (vars) {
      Object.keys(vars).forEach(function (key) {
        if (vars[key]) document.documentElement.style.setProperty(key, vars[key]);
      });
    }
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  }
  window.addEventListener("message", function (ev) {
    var m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method && Object.prototype.hasOwnProperty.call(m, "id") && (m.method === "ping" || m.method === "ui/resource-teardown")) {
      send({jsonrpc: "2.0", id: m.id, result: {}});
      return;
    }
    if (Object.prototype.hasOwnProperty.call(m, "id") && m.method == null && pending[m.id]) {
      var waiter = pending[m.id];
      delete pending[m.id];
      if (m.error) waiter.reject(m.error);
      else waiter.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") {
      if (!ready) queued = m.params || {};
      else show(m.params || {});
    } else if (m.method === "ui/notifications/host-context-changed") {
      applyTheme(m.params || {});
    } else if (m.method === "ui/notifications/tool-cancelled") {
      cap.textContent = "这一掷取消了";
    }
  });
  function handshake() {
    var id = ++seq;
    pending[id] = {
      resolve: function (res) {
        ready = true;
        notify("ui/notifications/initialized");
        applyTheme(res && res.hostContext);
        reportSize();
        if (queued) show(queued);
      },
      reject: function () { cap.textContent = "界面没有连上宿主"; }
    };
    send({
      jsonrpc: "2.0",
      id: id,
      method: "ui/initialize",
      params: {
        protocolVersion: "2026-01-26",
        appInfo: {name: "odin-gua", version: "0.4.1"},
        appCapabilities: {availableDisplayModes: ["inline"]}
      }
    });
  }

  buildCoins();
  window.__gua = {
    rows: function () {
      return [].map.call(rows.children, function (n) {
        return {value: n.dataset.value, coins: [n.dataset.c0, n.dataset.c1, n.dataset.c2]};
      });
    },
    caption: function () { return cap.textContent; }
  };
  if (window.parent === window) {
    show({
      structuredContent: {
        method: "coins",
        animate: true,
        values: "967879",
        coins: [[3, 3, 3], [2, 2, 2], [3, 2, 2], [3, 3, 2], [2, 3, 2], [3, 3, 3]]
      }
    });
  } else {
    handshake();
  }
  if (window.ResizeObserver) new ResizeObserver(function () { reportSize(); }).observe(document.getElementById("wrap"));
})();
  </script>
</body>
</html>
