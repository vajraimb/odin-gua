name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: odin-linux-amd64-dev-2026-07.tar.gz
          - os: macos-15
            asset: odin-macos-arm64-dev-2026-07.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Odin dev-2026-07
        run: |
          curl -sSL -o odin.tgz https://github.com/odin-lang/Odin/releases/download/dev-2026-07/${{ matrix.asset }}
          mkdir -p "$RUNNER_TEMP/odin" && tar xzf odin.tgz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - run: odin version && clang --version | head -1
      - name: Generated texts are up to date
        run: python3 tools/gen_texts.py && git diff --exit-code src/gua/texts_gen.odin
      - name: Build and test
        run: ./build.sh test
      - name: install.sh (dry-run + real, isolated HOME)
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh --dry-run --clients none
          ./install.sh --clients none
          "$HOME/.gua/bin/odin-gua" --self-test
          "$HOME/.gua/bin/odin-gua" --version
          ./install.sh --uninstall --clients none
          test ! -e "$HOME/.gua/bin/odin-gua"
      - name: install.sh downloads toolchain when odin is absent
        run: |
          export HOME="$RUNNER_TEMP/home2" && mkdir -p "$HOME"
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v "$RUNNER_TEMP/odin" | paste -s -d: -)"
          ! command -v odin
          ./install.sh --clients none
          test -x "$HOME/.gua/toolchain/odin-dev-2026-07/odin"
          "$HOME/.gua/bin/odin-gua" --self-test
